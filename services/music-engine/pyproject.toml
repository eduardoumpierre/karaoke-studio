[project]
name = "music-engine"
version = "0.1.0"
description = "Sidecar do Karaoke Studio: importação, separação, análise e biblioteca."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.0",
    "numpy",
    "pytest>=8",
    "ruff>=0.7",
]
# Separação por IA (pesado: PyTorch + CUDA, vários GB). Instale com: uv sync --group ml
# O CI e os testes não precisam dele (usam um separador falso).
ml = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "demucs",
    "soundfile",
    "numpy",
    "librosa>=0.10",
]

# Windows e Linux: PyTorch com CUDA 12.4. macOS: PyTorch do PyPI (tem MPS no Apple Silicon).
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
