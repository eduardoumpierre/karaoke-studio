[project]
name = "spike-demucs"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "demucs",
    "soundfile",
    "numpy",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
