[package]
name = "audio-engine"
version = "0.1.0"
edition = "2021"
description = "Motor de áudio do Karaoke Studio: decodificação, mixer, saída e entrada de áudio (sem dependência do Tauri)."

[dependencies]
cpal = "0.15"
log = "0.4"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5", default-features = false, features = ["flac", "mp3", "wav", "pcm"] }
